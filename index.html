<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <span class="title">CALCULATOR</span>
    </div>
    <div class="body">
        <div class="calculator">
            <div class="display">
                <span class="displayOutput"></span>
            </div>
            <div class="inputs">
                <div class="middle">
                    <button class="reset">C</button>
                    <button class="erase">del</button>
                </div>
                <div class="pad">
                    <div class="numbers">
                        <button class="seven">7</button>
                        <button class="eight">8</button>
                        <button class="nine">9</button>
                        <button class="four">4</button>
                        <button class="five">5</button>
                        <button class="six">6</button>
                        <button class="one">1</button>
                        <button class="two">2</button>
                        <button class="three">3</button>
                        <button class="zero">0</button>
                        <button class="decimal">.</button>
                        <button class="equal">=</button>
                    </div>
                    <div class="operators">
                        <button class="plus">+</button>
                        <button class="substract">-</button>
                        <button class="product">x</button>
                        <button class="divide">%</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        <span class="footTitle">Copyright &copy; Arcane 2026</span>
    </div>
    
</body>
</html>
